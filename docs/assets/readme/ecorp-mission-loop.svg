<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">ECorp governed mission loop</title>
  <desc id="desc">Two human operators direct an ECorp control server. A durable runner executes in an isolated git worktree. Human approval and evidence verification gate publication of a pull request, while events and evidence return to the operators.</desc>
  <style>
    .heading { font: 700 32px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; letter-spacing: 1px; }
    .label { font: 700 26px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; letter-spacing: .5px; }
    .small { font: 700 17px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; letter-spacing: .5px; }
    .micro { font: 700 15px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; letter-spacing: .5px; }
  </style>

  <rect width="1000" height="800" fill="#080712"/>
  <rect x="8" y="8" width="984" height="784" fill="none" stroke="#39245E" stroke-width="8"/>
  <rect x="22" y="22" width="956" height="756" fill="none" stroke="#211638" stroke-width="2"/>
  <text x="50" y="62" class="heading" fill="#F7F1DF">GOVERNED MISSION LOOP</text>
  <rect x="50" y="76" width="390" height="6" fill="#FFD447"/>
  <text x="950" y="61" text-anchor="end" class="small" fill="#75C09F">HUMAN AUTHORITY OUTBOUND</text>

  <!-- Outbound path -->
  <polyline points="290,180 350,180" fill="none" stroke="#FFD447" stroke-width="8"/>
  <polygon points="350,168 374,180 350,192" fill="#FFD447"/>
  <polyline points="625,180 685,180" fill="none" stroke="#FFD447" stroke-width="8"/>
  <polygon points="685,168 709,180 685,192" fill="#FFD447"/>
  <polyline points="835,265 835,319" fill="none" stroke="#FFD447" stroke-width="8"/>
  <polygon points="823,319 835,343 847,319" fill="#FFD447"/>
  <polyline points="710,410 650,410" fill="none" stroke="#FFD447" stroke-width="8"/>
  <polygon points="650,398 626,410 650,422" fill="#FFD447"/>
  <polyline points="375,410 315,410" fill="none" stroke="#FFD447" stroke-width="8"/>
  <polygon points="315,398 291,410 315,422" fill="#FFD447"/>
  <polyline points="165,495 165,549" fill="none" stroke="#FFD447" stroke-width="8"/>
  <polygon points="153,549 165,573 177,549" fill="#FFD447"/>

  <!-- Return path -->
  <polyline points="290,640 950,640 950,755 20,755 20,180 40,180" fill="none" stroke="#75C09F" stroke-width="6"/>
  <polygon points="34,168 58,180 34,192" fill="#75C09F"/>
  <text x="340" y="742" class="micro" fill="#75C09F">DURABLE STATE + AUDIT EVENTS + ACCEPTED EVIDENCE RETURN</text>

  <!-- Two human operators -->
  <g aria-label="Two human operators">
    <rect x="40" y="95" width="250" height="170" fill="#12101E" stroke="#35D6D0" stroke-width="6"/>
    <text x="165" y="130" text-anchor="middle" class="label" fill="#F7F1DF">TWO OPERATORS</text>
    <rect x="67" y="170" width="28" height="28" fill="#F7F1DF"/>
    <rect x="64" y="164" width="34" height="10" fill="#F04B8B"/>
    <rect x="70" y="198" width="22" height="38" fill="#35D6D0"/>
    <rect x="236" y="170" width="28" height="28" fill="#F7F1DF"/>
    <rect x="233" y="164" width="34" height="10" fill="#35D6D0"/>
    <rect x="239" y="198" width="22" height="38" fill="#F04B8B"/>
    <rect x="116" y="166" width="98" height="62" fill="#211638" stroke="#FFD447" stroke-width="4"/>
    <rect x="133" y="181" width="64" height="9" fill="#35D6D0"/>
    <rect x="145" y="201" width="40" height="9" fill="#FFD447"/>
    <text x="165" y="252" text-anchor="middle" class="small" fill="#75C09F">STEER + AUTHORIZE</text>
  </g>

  <!-- ECorp control server -->
  <g aria-label="ECorp control server">
    <rect x="375" y="95" width="250" height="170" fill="#12101E" stroke="#F04B8B" stroke-width="6"/>
    <text x="500" y="130" text-anchor="middle" class="label" fill="#F7F1DF">ECORP CONTROL</text>
    <rect x="414" y="158" width="172" height="76" fill="#211638"/>
    <rect x="432" y="174" width="54" height="9" fill="#35D6D0"/>
    <rect x="432" y="193" width="83" height="9" fill="#FFD447"/>
    <rect x="432" y="212" width="68" height="9" fill="#75C09F"/>
    <rect x="536" y="172" width="30" height="48" fill="#FFD447"/>
    <rect x="544" y="182" width="14" height="28" fill="#12101E"/>
    <text x="500" y="252" text-anchor="middle" class="small" fill="#F04B8B">AUTHORITATIVE STATE</text>
  </g>

  <!-- Durable runner -->
  <g aria-label="Durable runner">
    <rect x="710" y="95" width="250" height="170" fill="#12101E" stroke="#FFD447" stroke-width="6"/>
    <text x="835" y="122" text-anchor="middle" class="label" fill="#F7F1DF">DURABLE</text>
    <text x="835" y="151" text-anchor="middle" class="label" fill="#F7F1DF">RUNNER</text>
    <rect x="748" y="176" width="150" height="48" fill="#39245E"/>
    <rect x="890" y="186" width="34" height="38" fill="#F4A340"/>
    <rect x="772" y="188" width="58" height="9" fill="#35D6D0"/>
    <rect x="772" y="207" width="42" height="9" fill="#FFD447"/>
    <rect x="765" y="225" width="34" height="16" fill="#66647B"/>
    <rect x="869" y="225" width="34" height="16" fill="#66647B"/>
    <text x="835" y="252" text-anchor="middle" class="small" fill="#FFD447">SURVIVES THE UI</text>
  </g>

  <!-- Isolated worktree -->
  <g aria-label="Isolated git worktree">
    <rect x="710" y="325" width="250" height="170" fill="#12101E" stroke="#75C09F" stroke-width="6" stroke-dasharray="14 8"/>
    <text x="835" y="358" text-anchor="middle" class="label" fill="#F7F1DF">ISOLATED</text>
    <text x="835" y="387" text-anchor="middle" class="label" fill="#F7F1DF">WORKTREE</text>
    <line x1="835" y1="403" x2="835" y2="463" stroke="#F7F1DF" stroke-width="8"/>
    <line x1="835" y1="420" x2="792" y2="401" stroke="#35D6D0" stroke-width="7"/>
    <line x1="835" y1="436" x2="881" y2="407" stroke="#F04B8B" stroke-width="7"/>
    <rect x="784" y="392" width="20" height="20" fill="#35D6D0"/>
    <rect x="874" y="398" width="20" height="20" fill="#F04B8B"/>
    <rect x="825" y="454" width="20" height="20" fill="#FFD447"/>
    <rect x="918" y="398" width="20" height="30" fill="#FFD447"/>
    <rect x="922" y="387" width="12" height="18" fill="none" stroke="#FFD447" stroke-width="5"/>
    <text x="835" y="483" text-anchor="middle" class="small" fill="#75C09F">TASK BRANCH ONLY</text>
  </g>

  <!-- Approval gate -->
  <g aria-label="Human approval gate">
    <rect x="375" y="325" width="250" height="170" fill="#12101E" stroke="#F4A340" stroke-width="6"/>
    <text x="500" y="360" text-anchor="middle" class="label" fill="#F7F1DF">APPROVAL GATE</text>
    <rect x="420" y="394" width="12" height="68" fill="#FFD447"/>
    <rect x="568" y="394" width="12" height="68" fill="#FFD447"/>
    <rect x="420" y="394" width="160" height="12" fill="#FFD447"/>
    <rect x="432" y="429" width="136" height="10" fill="#D84D5B"/>
    <polyline points="456,427 481,451 545,396" fill="none" stroke="#58D68D" stroke-width="10"/>
    <text x="500" y="483" text-anchor="middle" class="small" fill="#F4A340">HUMAN DECISION</text>
  </g>

  <!-- Evidence verifier -->
  <g aria-label="Evidence verification">
    <rect x="40" y="325" width="250" height="170" fill="#12101E" stroke="#35D6D0" stroke-width="6"/>
    <text x="165" y="360" text-anchor="middle" class="label" fill="#F7F1DF">EVIDENCE CHECK</text>
    <rect x="112" y="386" width="106" height="78" fill="#F7F1DF"/>
    <rect x="130" y="401" width="56" height="8" fill="#39245E"/>
    <rect x="130" y="420" width="70" height="8" fill="#6A8CFF"/>
    <polyline points="132,444 146,458 178,430" fill="none" stroke="#58D68D" stroke-width="9"/>
    <rect x="96" y="438" width="138" height="7" fill="#35D6D0"/>
    <text x="165" y="483" text-anchor="middle" class="small" fill="#35D6D0">VERIFIER PASSES</text>
  </g>

  <!-- Pull request publication -->
  <g aria-label="Pull request publication">
    <rect x="40" y="575" width="250" height="150" fill="#12101E" stroke="#F04B8B" stroke-width="6"/>
    <text x="165" y="610" text-anchor="middle" class="label" fill="#F7F1DF">PULL REQUEST</text>
    <line x1="120" y1="637" x2="120" y2="686" stroke="#F7F1DF" stroke-width="8"/>
    <line x1="120" y1="655" x2="193" y2="655" stroke="#F7F1DF" stroke-width="8"/>
    <line x1="193" y1="655" x2="193" y2="686" stroke="#F7F1DF" stroke-width="8"/>
    <rect x="109" y="626" width="22" height="22" fill="#35D6D0"/>
    <rect x="109" y="680" width="22" height="22" fill="#FFD447"/>
    <rect x="182" y="644" width="22" height="22" fill="#F04B8B"/>
    <rect x="182" y="680" width="22" height="22" fill="#58D68D"/>
    <polygon points="218,644 244,657 218,670" fill="#FFD447"/>
    <text x="165" y="714" text-anchor="middle" class="small" fill="#F04B8B">PUBLISH FOR REVIEW</text>
  </g>
</svg>
