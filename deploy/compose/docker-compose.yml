services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crony
      POSTGRES_PASSWORD: crony
      POSTGRES_DB: crony
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crony -d crony"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - crony-postgres:/var/lib/postgresql/data

volumes:
  crony-postgres:

